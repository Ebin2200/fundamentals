<script>
let furniture = ["chair", "wardrobe", "stool", "bed"];

for (let i = 0; i < furniture.length; i++) {
    document.write("The item is " + furniture[i] + "<br/>");
}

let i = 0;

while (i < furniture.length) {
    document.write("The item is " + furniture[i] + "<br/>");
    i++;
}

i = 0;

do {
    document.write("The item is " + furniture[i] + "<br/>");
    i++;
} while (i < furniture.length);
</script>
