<script>
        let evencount=0;
        let oddcount=0;
    
        for(let i=1; i<=10;i++){
        
        let number=Number(prompt("Enter number"+i));
       
        if(number%2==0){
           evencount++;
        }
        else{
          oddcount++;
         }
        }
        document.write("Even numbers="+evencount+
        document.write("odd numbers="+oddcount);
</script>
