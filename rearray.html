<script>
        function reverse_array(array=[]){
        var new_array=[]
        for(i=array.length-1;i>=0;i--){
          new_array.push(array[i])
        }
        return new_array
        }
        var numbers=[1,2,3,4,5]
        var result=reverse_array(numbers)
        document.write(result)
</script>
