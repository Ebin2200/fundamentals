<script>
        var number=15;
        if(number%3==0&&number%5==0){
         document.write("fizzbuzz");
        }
        else if(number%3==0){
         document.write("fizz");
        }
        else if(number%5==0){
         document.write("buzz");
        }
        else{
         document.write("Not a multiple of 3 or 5");
        }
</script>
