<script>
    function calculator(a, b, operator) {
        if (operator == "+") {
            return a + b;
        } else if (operator == "-") {
            return a - b;
        } else if (operator == "*") {
            return a * b;
        } else if (operator == "/") {
            return a / b;
        }
    }

    document.write(calculator(15, 7, "*"));
</script>
