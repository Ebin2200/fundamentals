<script>
    function calculator(a, b, operator) {
        if (operator == "+") {
            return a + b;
        } else if (operator == "-") {
            return a - b;
        } else if (operator == "*") {
            return a * b;
        } else if (operator == "/") {
            return a / b;
        }
    }

    document.write(calculator(10, 5, "+"));
</script>
